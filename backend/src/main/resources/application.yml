spring:
  application:
    name: contract-manager
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:contract_manager}
    username: ${DB_USERNAME:contract_manager}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  mvc:
    log-request-details: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Backend do Sistema de Gestão de Contratos
    java-version: ${java.version}

logging:
  level:
    root: INFO
    com.organization.contractmanager: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

keycloak:
  admin:
    enabled: ${KEYCLOAK_ADMIN_ENABLED:false}
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:}
    realm: ${KEYCLOAK_ADMIN_REALM:${KEYCLOAK_REALM:contract-manager}}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

notification:
  cron: ${NOTIFICATION_CRON:0 0 8 * * *}
  batch-size: ${NOTIFICATION_BATCH_SIZE:100}
  mail:
    from: ${MAIL_FROM:}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com}
    api-version: ${WHATSAPP_API_VERSION:v23.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
