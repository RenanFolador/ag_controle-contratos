<main class="login-page">
  <section class="login-brand" aria-labelledby="login-title">
    <div class="brand-mark"><mat-icon>business_center</mat-icon></div>
    <p class="eyebrow">Sistema corporativo</p>
    <h1 id="login-title">Sistema de Gestão de Contratos</h1>
    <p class="intro">Gestão e acompanhamento de contratos em um único lugar.</p>
  </section>

  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Acesso ao sistema</mat-card-title>
      <mat-card-subtitle>Entre utilizando sua conta institucional.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="security-note">
        A autenticação é realizada com segurança pelo Keycloak. A aplicação não armazena sua
        senha.
      </p>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-flat-button color="primary" type="button" [disabled]="loading()" (click)="login()">
        <mat-icon>login</mat-icon>
        {{ loading() ? 'Conectando...' : 'Entrar com Keycloak' }}
      </button>
    </mat-card-actions>
  </mat-card>
</main>
